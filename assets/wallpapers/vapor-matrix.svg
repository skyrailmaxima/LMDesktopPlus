  <title>vapor-matrix wallpaper</title>
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="59.3%" r="75%">
      <stop offset="0%" stop-color="#0b0817"/>
      <stop offset="45%" stop-color="#05060a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0817"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff2e97"/>
      <stop offset="55%" stop-color="#ff71ce"/>
      <stop offset="100%" stop-color="#01cdfe"/>
    </linearGradient>
    <linearGradient id="horizonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#01cdfe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff2e97" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#01cdfe" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glowTight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="sunClip">
      <circle cx="960" cy="640" r="260"/>
    </clipPath>
  </defs>

