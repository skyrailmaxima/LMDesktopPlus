<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LMDesktopPlus Live Wallpaper</title>
  <style>
    :root { --dv-mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, monospace; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      cursor: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="matrix-rain" data-dv-rain data-dv-intensity="55" aria-hidden="true"></canvas>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var intensity = params.get("i");
      if (intensity != null && intensity !== "") {
        document.getElementById("matrix-rain").dataset.dvIntensity = String(intensity);
      }
    })();
  </script>
  <script src="digitalvapor.js"></script>
</body>
</html>
