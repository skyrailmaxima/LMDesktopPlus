[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lmdesktopplus"
version = "0.6.2"
description = "Vapor//matrix machine UI and desktop integration for Linux Mint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LMDesktopPlus contributors" }]
keywords = ["linux-mint", "cinnamon", "hyprland", "desktop", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Environment :: Wayland",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment",
]

[project.scripts]
lmdesktopplus = "lmdesktopplus.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lmdesktopplus = ["static/*", "static/icons/*"]
