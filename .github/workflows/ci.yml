name: CI

on:
  push:
    branches: [main, feature/lmdesktopplus]
  pull_request:
    branches: [main, feature/lmdesktopplus]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node (JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev xz-utils

      - name: Show environment
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          python3 --version
          node --version
          dpkg-deb --version | head -n1
          xz --version | head -n1
          git rev-parse --short HEAD
          git branch --show-current || true

      - name: Run full suite
        run: ./tests/run-all.sh

      - name: Upload package artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*-freebsd.txz
          if-no-files-found: warn
          retention-days: 14

  ui-screenshots:
    name: ui screenshots (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GTK/WebKit + Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool xauth \
            python3-gi gir1.2-gtk-3.0 \
            "gir1.2-webkit2-4.1" \
            libgtk-3-0 libwebkit2gtk-4.1-0 \
            fonts-dejavu-core

      - name: Show environment
        run: |
          set -euo pipefail
          Xvfb -help 2>&1 | head -n1 || true
          python3 -c 'import gi; gi.require_version("Gtk","3.0"); print("gi + Gtk 3.0 OK")'
          PYTHONPATH=src python3 -c 'from lmdesktopplus.toolkit import select_toolkit; print("toolkit:", select_toolkit())'

      - name: Per-scene screenshot smoke
        run: ./tests/ui-screenshot.sh --out "$GITHUB_WORKSPACE/ui-screenshots"

      - name: Responsive small-window smoke
        run: |
          ./tests/ui-screenshot.sh \
            --out "$GITHUB_WORKSPACE/ui-screenshots/narrow" \
            --geom 720x940x24 --window 700x900 \
            --scenes "desktop monitor settings apps"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.sha }}
          path: |
            ui-screenshots/*.png
            ui-screenshots/narrow/*.png
          if-no-files-found: warn
          retention-days: 14
