name: CI

on:
  push:
    branches: [main, feature/lmdesktopplus]
  pull_request:
    branches: [main, feature/lmdesktopplus]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node (JS syntax checks)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev xz-utils

      - name: Show environment
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          python3 --version
          node --version
          dpkg-deb --version | head -n1
          xz --version | head -n1
          git rev-parse --short HEAD
          git branch --show-current || true

      - name: Run full suite
        run: ./tests/run-all.sh

      - name: Upload package artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ github.sha }}
          path: |
            dist/*.deb
            dist/*-freebsd.txz
          if-no-files-found: warn
          retention-days: 14
