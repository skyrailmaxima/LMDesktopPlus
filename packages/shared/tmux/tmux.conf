# LMDesktopPlus vapor//matrix tmux theme

set -g status-style bg=#0b0817,fg=#01cdfe
set -g status-left ""
set -g status-right "#[fg=#8dffbe]%Y-%m-%d %H:%M"

setw -g window-status-current-style fg=#ff2e97,bg=#0b0817,bold
setw -g window-status-style fg=#01cdfe,bg=#0b0817

set -g pane-border-style fg=#0b0817
set -g pane-active-border-style fg=#ff2e97

set -g message-style bg=#0b0817,fg=#05ffa1

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
