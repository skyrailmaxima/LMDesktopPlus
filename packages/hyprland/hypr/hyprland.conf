# LMDesktopPlus vapor//matrix Hyprland config
# Palette: palette/vapor-matrix.theme (mag #ff2e97, cyan #01cdfe, mint #05ffa1, bg #05060a)

monitor=,preferred,auto,1

# Wallpaper is served by hyprpaper (falls back to swaybg if hyprpaper is unavailable;
# see packages/hyprland/hypr/hyprpaper.conf and install-notes.md).
exec-once = waybar
exec-once = hyprpaper
# exec-once = swaybg -i ~/.local/share/lmdesktopplus/wallpapers/vapor-matrix.svg -m fill

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgb(01cdfe) rgb(ff2e97) 45deg
    col.inactive_border = rgba(0b0817aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(05060a99)
    }
}

animations {
    enabled = true
    bezier = vaporEase, 0.16, 1, 0.3, 1
    animation = windows, 1, 5, vaporEase
    animation = windowsOut, 1, 5, vaporEase, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, vaporEase
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

gestures {
    workspace_swipe = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(05060a)
}

# Core bindings. Editable vapor//matrix chords (terminal, launcher, agent,
# kill/fullscreen/float/lock) live in hypr-binds.conf — Settings → Keybinds.
$mainMod = SUPER

# Legacy Super+D launcher kept for muscle memory; overlay also binds Super+Space.
bind = $mainMod, D, exec, rofi -show drun
# Confirm via rofi/waybar; hard-exit stays on Super+Shift+E for power users.
bind = $mainMod, E, exec, ~/.config/hypr/scripts/exit-menu.sh
bind = $mainMod SHIFT, E, exit,

bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , Print, exec, grim ~/Pictures/lmdesktopplus-$(date +%s).png

# LMDesktopPlus UI-generated appearance overlay (empty stub created by install.sh).
source = ~/.config/lmdesktopplus/hypr-generated.conf

# LMDesktopPlus vapor//matrix chord overlay (editable via Settings → Keybinds).
source = ~/.config/lmdesktopplus/hypr-binds.conf

# Live wallpaper window rules are appended by LiveWallpaperAdapter when enabled
# (owned ~/.config/lmdesktopplus/hypr-live-wallpaper.conf; feature default off).
