# LMDesktopPlus vapor//matrix wallpaper for hyprpaper
# hyprpaper only decodes raster formats (png/jpg), so install.sh materializes a
# rasterized copy of assets/wallpapers/vapor-matrix.svg at the path below.
# If rasterization is unavailable at install time, hyprland.conf falls back to
# swaybg pointed at the SVG directly (swaybg can render SVG via librsvg).

preload = ~/.local/share/lmdesktopplus/wallpapers/vapor-matrix.png
wallpaper = ,~/.local/share/lmdesktopplus/wallpapers/vapor-matrix.png

splash = false
ipc = on
